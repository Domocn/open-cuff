name: open_cuff
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^3.6.1
  device_info_plus: ^13.3.0
  excel: ^4.0.6
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.3
  flutter_reactive_ble: ^5.6.0
  flutter_timezone: ^5.1.1
  health: ^13.3.2
  home_widget: ^0.10.0
  http: ^1.6.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdf: ^3.12.0
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  min_sdk_android: 26
